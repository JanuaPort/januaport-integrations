# #1130: fixed read-only reports from the private google-reporting service.
# Stufe 1 — gebaut, noch nicht live abgenommen. No Google identity in JanuaPort.
# Configure as corp integration. Internal target_address approval required.
# Audit depth MUST be metadaten for SSO and token callers before activation.
# All declared parameters are redacted; higher audit depth stores declared input.
# Query text remains disabled by service default until SEC accepts residual risk.
# Official contracts: developers.google.com/webmaster-tools/v1/searchanalytics/query
# developers.google.com/analytics/devguides/reporting/data/v1/rest/v1beta/properties/runReport
name: google-search-console
version: "1.0.0"
description: >
  Fixed Search Console reports for an operator approved public website.
  Read-only, exact public page allowlist, 28 or 90 inclusive source-local days ending at least
  three days ago. No user attribution, free dimensions, property discovery or Odoo export.
base_url: http://google-reporting:8092
auth:
  header: Authorization
  template: "Bearer {{credential}}"
  credential: google-search-console
timeout: 25s
min_interval: 500ms
redact_params: [period_days, end_date, segment, page_path, limit]
tools:
  - name: get_status
    description: >
      Check configured source access with a small read-only Google probe. Fixed states ready,
      not_configured, access_denied, quota_limited, unavailable. No property IDs or raw errors.
      This is separate from local container health. GA4 also validates fixed report compatibility.
    check: true
    request:
      method: GET
      path: /v1/gsc/get_status
    response: "{schema_version: schema_version, source: source, report: report, state: state, checked_at: checked_at, definition_version: definition_version, report_definitions: report_definitions, key_events: key_events, query_reports: query_reports}"
  - name: performance_overview
    description: >
      Daily clicks, impressions, CTR and position. Source days America/Los_Angeles. Missing days are unknown, not zero. CTR and position must not be averaged across rows.
      Fixed public segment membership; no account, property, dimension, metric or filter override.
    params:
      - name: period_days
        type: integer
        description: Optional inclusive period, 28 or 90 days. Default 28.
      - name: end_date
        type: string
        description: Optional ISO date YYYY-MM-DD, at most source today minus three days.
      - name: segment
        type: string
        enum: [all_public, atas, gateway, shared]
        description: Optional approved disjoint public page group. Default all_public.
      - name: page_path
        type: string
        description: Optional exact approved public path inside segment. No URL, query or user path.
    request:
      method: GET
      path: /v1/gsc/performance_overview
      query:
        - name: period_days
          value: "{period_days}"
        - name: end_date
          value: "{end_date}"
        - name: segment
          value: "{segment}"
        - name: page_path
          value: "{page_path}"
    response: "{schema_version: schema_version, source: source, report: report, state: state, range: range, scope: scope, rows: rows, quality: quality, fetched_at: fetched_at, measurement: measurement}"
  - name: query_summary
    description: >
      Bounded top queries, sorted by Google clicks. Disabled until operator SEC approval. Small groups suppressed; pattern pseudonymization cannot anonymize names. Never sum this selection as a total.
      Fixed public segment membership; no account, property, dimension, metric or filter override.
    params:
      - name: period_days
        type: integer
        description: Optional inclusive period, 28 or 90 days. Default 28.
      - name: end_date
        type: string
        description: Optional ISO date YYYY-MM-DD, at most source today minus three days.
      - name: segment
        type: string
        enum: [all_public, atas, gateway, shared]
        description: Optional approved disjoint public page group. Default all_public.
      - name: page_path
        type: string
        description: Optional exact approved public path inside segment. No URL, query or user path.
      - name: limit
        type: integer
        description: Optional maximum rows, 1 through 100. Default 25. No pagination or export.
    request:
      method: GET
      path: /v1/gsc/query_summary
      query:
        - name: period_days
          value: "{period_days}"
        - name: end_date
          value: "{end_date}"
        - name: segment
          value: "{segment}"
        - name: page_path
          value: "{page_path}"
        - name: limit
          value: "{limit}"
    response: "{schema_version: schema_version, source: source, report: report, state: state, range: range, scope: scope, rows: rows, quality: quality, fetched_at: fetched_at, measurement: measurement}"
    privacy:
      scan:
        - field: query
          patterns: [email, telefon, iban]
  - name: page_summary
    description: >
      Bounded top approved public page paths with clicks, impressions, CTR and position. Unknown paths excluded. Top rows are not a complete total.
      Fixed public segment membership; no account, property, dimension, metric or filter override.
    params:
      - name: period_days
        type: integer
        description: Optional inclusive period, 28 or 90 days. Default 28.
      - name: end_date
        type: string
        description: Optional ISO date YYYY-MM-DD, at most source today minus three days.
      - name: segment
        type: string
        enum: [all_public, atas, gateway, shared]
        description: Optional approved disjoint public page group. Default all_public.
      - name: page_path
        type: string
        description: Optional exact approved public path inside segment. No URL, query or user path.
      - name: limit
        type: integer
        description: Optional maximum rows, 1 through 100. Default 25. No pagination or export.
    request:
      method: GET
      path: /v1/gsc/page_summary
      query:
        - name: period_days
          value: "{period_days}"
        - name: end_date
          value: "{end_date}"
        - name: segment
          value: "{segment}"
        - name: page_path
          value: "{page_path}"
        - name: limit
          value: "{limit}"
    response: "{schema_version: schema_version, source: source, report: report, state: state, range: range, scope: scope, rows: rows, quality: quality, fetched_at: fetched_at, measurement: measurement}"
