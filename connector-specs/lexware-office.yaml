# Lexware Office (lexoffice) Public API — read tools plus four write tools.
#
# API:        https://api.lexware.io  (Bearer API key, generated by the
#             account owner at https://app.lexware.de/addons/public-api)
# Key scopes: since 2024-05-07 a user can hold several keys, choose the areas
#             (scopes) per key and renew a key. Choose only the areas the granted
#             tools need; a missing area answers 403. A key created before a new
#             endpoint existed does not get that endpoint's area: after a template
#             update with new tools, create a new key and replace it in the vault.
#             The public docs do not list the area names per endpoint.
# Docs:       https://developers.lexware.io/docs/
# Credential: stored in the JanuaPort vault under the name "lexware"
#             (jnpt credential set --name lexware). The key is NEVER in this file.
#
# Scope: mostly read-only (GET) — list vouchers in a period, fetch a single
# voucher (purchase docs via get_voucher, sales invoices via get_invoice), look
# up contacts. PLUS two deliberate write tools (Phase 2):
#   * upload_voucher_file attaches a receipt file to the Lexware voucher INBOX
#     (POST /v1/files, type=voucher) — a NEW, not-yet-booked document.
#   * attach_file_to_voucher attaches a receipt file to an EXISTING, already-
#     booked voucher (POST /v1/vouchers/{id}/files) — the "Beleg fehlt" fix.
# Inbox vs. anheften: get_voucher's response carries a "files" array (the ids of
# attached documents); an EMPTY "files" array = no receipt image attached. Use
# attach_file_to_voucher to fix exactly that voucher; use upload_voucher_file
# only to create a fresh inbox document. There is NO file field in the
# voucherlist and NO list filter on receipt presence — find missing receipts by
# paging the list and calling get_voucher per entry (deliberate N+1).
# PLUS two write tools for the sales side:
#   * create_contact creates a customer contact (POST /v1/contacts).
#   * create_invoice creates a FINALIZED sales invoice (POST /v1/invoices with
#     the CONSTANT query finalize=true — never a parameter: the API cannot change
#     an invoice's status afterwards). Up to three line items (fixed list length
#     of the JSON body format), tax type net, service period required (§ 14
#     UStG). Reverse charge and other tax-free EU cases are deliberately out of
#     scope. The API has NO mail endpoint (the tool sends nothing) and NO
#     idempotency key (a repeated POST creates a second invoice) — both stated
#     in the tool description. The PDF (GET /v1/invoices/{id}/file, binary) is
#     not a tool here: a REST tool returns JSON.
# All four write tools are marked write: true — each needs a tool-exact token
# scope (e.g. lexware-office:create_invoice); a connector-wide scope does NOT
# grant them (deny-by-default for writes, see docs/connector-spec.md).
# redact_params keeps customer data out of the audit (names, address, email,
# VAT id, free texts); amounts, quantities, tax rates and dates stay visible.
#
# WICHTIG — typ-spezifische Detail-Endpunkte: /v1/voucherlist ist ein
# typ-ÜBERGREIFENDER Index, aber die Detail-Abfrage ist typ-spezifisch. Es gibt
# KEINEN generischen /v1/vouchers/{id}-Endpunkt für alle Typen:
#   * /v1/vouchers/{id}  bedient NUR Einkaufsbelege (purchaseinvoice,
#     purchasecreditnote)               -> Tool get_voucher
#   * /v1/invoices/{id}  bedient Verkaufsrechnungen (voucherType=invoice)
#                                        -> Tool get_invoice
# Die weiteren Typen haben eigene Endpunkte (creditnote -> /v1/credit-notes/{id},
# deliverynote -> /v1/delivery-notes/{id}, orderconfirmation ->
# /v1/order-confirmations/{id}, quotation -> /v1/quotations/{id},
# downpaymentinvoice -> /v1/down-payment-invoices/{id}, dunning ->
# /v1/dunnings/{id}). Diese sind hier BEWUSST NICHT als Tools ergänzt
# (Read-only-MVP, klein und robust, §3) — dokumentierte Option für später, falls
# ein Use-Case sie braucht. Beleg-Abgleich (purchaseinvoice) und der häufigste
# Verkaufsfall (invoice) sind abgedeckt.
#
# Rate limit: the Lexware API allows ~2 requests/second. min_interval: 500ms
# keeps JanuaPort safely under that without any retry logic.

name: lexware-office
# Fassung dieser Vorlage — siehe demo-erp.yaml für die Bedeutung.
# 1.0.2: NUR die Beschreibungen der beiden Schreibwerkzeuge — Kernsatz
# statt „a human must confirm", ohne Autonomie-Sperre und ohne Zusatzsatz zu
# Geld/Außenwirkung (ein Beleg ablegen bzw. anhängen tut beides nicht).
# Keine Flächen-Änderung,
# deshalb PATCH (surface.go: reine Beschreibung ist ein Fix).
# 2.0.0: zwei neue Schreibwerkzeuge create_contact und create_invoice,
# dazu redact_params — neue Werkzeuge ändern die Fläche, deshalb MAJOR
# (surface.go: DimToolAdded; belegt in lexware_rechnung_spec_test.go).
# 3.0.0: payment_term_label von create_invoice wird Pflicht — Lexware
# lehnt jede Rechnung ohne paymentTermLabel ab (HTTP 406, Live-Beleg 15.10.).
# Ein Wechsel optional → Pflicht ändert, was ein Agent senden muss, deshalb MAJOR
# (surface.go: DimParamRequired; belegt in lexware_rechnung_spec_test.go).
# Dazu die Beschreibung: eine teilweise gesetzte Position lehnt JanuaPort jetzt
# vor dem Senden ab (Listen-Objekt fail-closed, runtime/json.go).
version: "3.0.0"
description: >
  Lexware Office accounting: read vouchers, invoices and contacts, attach
  receipt files to the inbox or to an existing voucher, and create customer
  contacts and finalized sales invoices.
base_url: https://api.lexware.io

auth:
  header: Authorization
  template: "Bearer {{credential}}"
  credential: lexware

# Lexware allows roughly 2 requests per second; 500 ms between calls stays under
# the limit. A single 429 is reported back to the agent as a clear rate-limit error.
min_interval: 500ms
timeout: 30s

# Audit without customer data: names, address, email, VAT id and free
# texts stay out of the audit log; amounts, quantities, tax rates, dates and the
# contact id stay visible. `email` also covers the list_contacts search filter.
redact_params:
  - company_name
  - vat_id
  - first_name
  - last_name
  - street
  - zip
  - city
  - email
  - title
  - introduction
  - remark
  - item1_name
  - item2_name
  - item3_name

tools:
  - name: list_vouchers
    description: >
      Lists vouchers (invoices, credit notes, quotations, order confirmations,
      delivery notes, down-payment invoices, and purchase documents) from
      Lexware Office, filtered by type and status and optionally by date range.
      This is a TYPE-SPANNING INDEX: each entry has the voucher id, voucherType,
      voucherStatus, voucherNumber, voucherDate, the contact/company name, the
      gross total amount and currency, and whether the voucher is archived.
      Both voucherType and voucherStatus are REQUIRED by the API. Dates use the
      format YYYY-MM-DD (e.g. 2026-05-01). Results are paged: use page (0-based)
      and size (default 25, max 250) to page through large result sets — request
      the next page by increasing page.
      To fetch the FULL DETAILS of one entry, the detail call is type-specific —
      pick the detail tool by voucherType: for purchaseinvoice/purchasecreditnote
      use get_voucher; for invoice use get_invoice. (Other types such as
      creditnote or deliverynote have no detail tool yet; the list entry already
      carries number, date, contact and gross total.)
      Typical receipt-reconciliation use ("is this incoming supplier receipt
      already booked?"): set voucherType=purchaseinvoice, voucherStatus=any and
      the date range, page through the result, then use get_voucher on a matching
      id when you need the line items. For sales-side questions ("which sales
      invoices were recorded last month?") set voucherType=invoice and the status
      you care about, then use get_invoice for details.
      NOTE on missing receipt images: this list carries NO file/attachment field
      and there is NO list filter for whether a receipt image is present. To find
      "purchase vouchers booked WITHOUT a receipt image", page through this list
      with voucherType=purchaseinvoice and, FOR EACH entry, call get_voucher and
      inspect its "files" array — an empty "files" array means no receipt is
      attached. This is deliberately N+1 (one detail call per entry), so keep the
      date range narrow (the API allows only ~2 requests/second).
    # Diese Probe trifft den echten Endpunkt; sie hat einen Pflichtparameter,
    # daher wählt `jnpt connector check` sie nur, wenn sie als check markiert
    # ist — hier bewusst NICHT markiert, weil voucherType/Status Pflicht sind.
    params:
      - name: voucherType
        description: >
          Required. The voucher category to list. One of: invoice, creditnote,
          orderconfirmation, quotation, deliverynote, downpaymentinvoice,
          purchaseinvoice, purchasecreditnote. Combine several with a comma
          (e.g. "invoice,creditnote").
        type: string
        required: true
      - name: voucherStatus
        description: >
          Required. A SINGLE status to filter by. One of: draft, open, paid,
          paidoff, voided, transferred, sepadebit, overdue, accepted, rejected.
          Pass exactly one status per call — the API rejects comma-combined
          statuses (e.g. "open,overdue") with HTTP 400. If you need several
          statuses (e.g. open AND overdue), make one call per status and merge
          the results yourself. The value "any" may be passed to ignore status
          (if supported by the API).
        type: string
        required: true
      - name: voucherDateFrom
        description: >
          Optional. Only vouchers dated on or after this date (inclusive),
          format YYYY-MM-DD.
        type: string
      - name: voucherDateTo
        description: >
          Optional. Only vouchers dated on or before this date (inclusive),
          format YYYY-MM-DD.
        type: string
      - name: archived
        description: >
          Optional. true returns only archived vouchers, false only non-archived.
          Omit to include both.
        type: boolean
      - name: page
        description: >
          Optional. Zero-based page number. Defaults to 0 (the first page).
          Increase to fetch further pages.
        type: integer
      - name: size
        description: >
          Optional. Number of vouchers per page. Default 25, maximum 250.
        type: integer
    request:
      method: GET
      path: /v1/voucherlist
      query:
        - name: voucherType
          value: "{voucherType}"
        - name: voucherStatus
          value: "{voucherStatus}"
        - name: voucherDateFrom
          value: "{voucherDateFrom}"
        - name: voucherDateTo
          value: "{voucherDateTo}"
        - name: archived
          value: "{archived}"
        - name: page
          value: "{page}"
        - name: size
          value: "{size}"
    # Die Voucherlist-Antwort umschließt die Treffer in "content" plus
    # Paging-Metadaten. Wir reichen content (das Array) plus die wichtigsten
    # Paging-Felder durch, damit der Agent weiß, ob es weitere Seiten gibt.
    response: "{vouchers: content, page: number, totalPages: totalPages, last: last}"

  - name: get_voucher
    description: >
      Retrieves a single PURCHASE document (an incoming supplier receipt) from
      Lexware Office by its id. This endpoint serves ONLY purchase vouchers —
      voucherType purchaseinvoice or purchasecreditnote (as listed by
      list_vouchers). For a sales invoice (voucherType=invoice) use get_invoice
      instead; calling this tool with a sales-invoice id fails with HTTP 400.
      Returns the full voucher with all details: type, status, voucher and
      document numbers, voucher date and due date, the associated contact, all
      line items (description, quantity, unit price, tax rate), the net/tax/gross
      totals and currency, and remarks. Use this after list_vouchers (with
      voucherType=purchaseinvoice or purchasecreditnote) when you need the
      complete content of one specific purchase document.
      The response also contains a "files" array: the ids of the documents
      (receipt images) attached to this voucher. An EMPTY "files" array means NO
      receipt image/document is attached — the typical "Beleg fehlt" case for a
      booked purchase voucher. To attach the missing receipt image to exactly
      this voucher, use attach_file_to_voucher — IF it appears in your tool
      list. Being a write action, it always needs its own tool-exact write
      scope for this integration; a connector-wide or read-only scope never
      grants it. Do NOT use upload_voucher_file as a substitute — that only
      drops an unrelated new document into the inbox. If
      attach_file_to_voucher is missing from your tool list, use
      report_problem, naming this integration (exact name as shown by the
      catalog tool), so a human can grant the scope or attach the file for
      you.
    params:
      - name: id
        description: >
          Required. The id (UUID) of a purchase voucher
          (purchaseinvoice/purchasecreditnote) as returned by list_vouchers.
        type: string
        required: true
    request:
      method: GET
      path: /v1/vouchers/{id}
    # Einzelner Einkaufsbeleg: unverändert durchreichen (kein Mapping nötig).
    # /v1/vouchers/{id} bedient laut Lexware-Doku ausschließlich Einkaufsbelege
    # (purchaseinvoice/purchasecreditnote); Verkaufsrechnungen -> get_invoice.

  - name: get_invoice
    description: >
      Retrieves a single SALES INVOICE (an outgoing invoice you issued) from
      Lexware Office by its id. Use this for voucherType=invoice — the id comes
      from list_vouchers run with voucherType=invoice. This is the sales-side
      counterpart to get_voucher (which serves incoming purchase documents);
      do NOT use get_voucher for a sales invoice (it returns HTTP 400).
      Returns the full invoice with all details: status, invoice and document
      numbers, voucher date and due date, the customer contact, all line items
      (description, quantity, unit price, tax rate), the net/tax/gross totals and
      currency, payment terms and remarks. Use this after list_vouchers when you
      need the complete content of one specific sales invoice.
    params:
      - name: id
        description: >
          Required. The sales invoice's id (UUID) as returned by list_vouchers
          when run with voucherType=invoice.
        type: string
        required: true
    request:
      method: GET
      path: /v1/invoices/{id}
    # Einzelne Verkaufsrechnung: unverändert durchreichen (kein Mapping nötig).

  - name: list_contacts
    description: >
      Lists and searches contacts (customers and vendors) in Lexware Office.
      Returns a paged list — each contact has its id, the company name or the
      person's first/last name, roles (customer and/or vendor), customer/vendor
      number, and primary email address. Filter by email or name (case-insensitive
      pattern match, minimum 3 characters), or restrict to customers or vendors
      only. Use this to resolve a name or email from a receipt to a Lexware
      contact, or to look up a contact's number. Results are paged via page
      (0-based) and size (default 25, max 250).
    params:
      - name: email
        description: >
          Optional. Case-insensitive pattern match on the email address (at least
          3 characters). Wildcards _ and % are supported.
        type: string
      - name: name
        description: >
          Optional. Case-insensitive pattern match on the contact/company name
          (at least 3 characters). Wildcards _ and % are supported.
        type: string
      - name: customer
        description: >
          Optional. true returns only contacts that are customers.
        type: boolean
      - name: vendor
        description: >
          Optional. true returns only contacts that are vendors.
        type: boolean
      - name: page
        description: >
          Optional. Zero-based page number. Defaults to 0 (the first page).
        type: integer
      - name: size
        description: >
          Optional. Number of contacts per page. Default 25, maximum 250.
        type: integer
    request:
      method: GET
      path: /v1/contacts
      query:
        - name: email
          value: "{email}"
        - name: name
          value: "{name}"
        - name: customer
          value: "{customer}"
        - name: vendor
          value: "{vendor}"
        - name: page
          value: "{page}"
        - name: size
          value: "{size}"
    response: "{contacts: content, page: number, totalPages: totalPages, last: last}"

  - name: upload_voucher_file
    description: >
      Uploads a receipt/document FILE into the Lexware Office voucher inbox
      ("Belegerfassung"), so Lexware can attach it to a booking. It creates a
      new file in the account's inbox. This is a WRITE action. It is annotated
      as such, so your client may ask the user; JanuaPort itself never asks.
      It needs the tool-exact permission "lexware-office:upload_voucher_file".
      The file is sent as base64 in the "content"
      parameter (max 5 MiB after decoding); provide a sensible "filename" and
      the file's "content_type" (e.g. application/pdf, image/jpeg, image/png).
      The document lands in the inbox only — it is NOT booked or matched to a
      payment automatically; Lexware's own matching takes over from there
      (assigning a receipt to a bank transaction is not available via the API).
      On success returns the new file's id. Typical use: after finding the right
      receipt, upload it here, then tell the user it is in the Lexware inbox for
      review. Retrying after an error may upload a SECOND copy — check the inbox
      first.
      Distinction: to add a receipt image to an ALREADY EXISTING/booked voucher
      (whose "files" array is empty), use attach_file_to_voucher instead — IF
      it appears in your tool list (as a write action it needs its own
      tool-exact write scope for this integration, separate from this tool's).
      upload_voucher_file only creates a NEW inbox document and does NOT attach
      to an existing voucher; if attach_file_to_voucher is unavailable to you,
      do not upload here as a workaround — that creates an unrelated
      duplicate. Use report_problem instead, naming this integration (exact
      name as shown by the catalog tool).
    write: true
    params:
      - name: content
        description: >
          Required. The file content, base64-encoded. Maximum 5 MiB after
          decoding. The raw bytes are never logged or returned.
        type: string
        required: true
      - name: filename
        description: >
          Required. The file name shown in the Lexware inbox, e.g.
          "rechnung-2026-05.pdf".
        type: string
        required: true
      - name: content_type
        description: >
          Required. The MIME type of the file, e.g. application/pdf, image/jpeg
          or image/png. Must match the actual file content.
        type: string
        required: true
    request:
      method: POST
      path: /v1/files
      encoding: multipart
      body:
        # type=voucher routes the upload into the voucher inbox (Belegerfassung).
        - name: type
          value: voucher
        # The binary file part. filename + content_type come from the agent's
        # arguments; the content is base64-decoded by JanuaPort before sending.
        - name: file
          file: content
          filename: "{filename}"
          content_type: "{content_type}"
    # Lexware returns the created file with its id; project to just the id.
    response: "{id: id}"

  - name: attach_file_to_voucher
    description: >
      Attaches a receipt/document FILE to an EXISTING, already-booked voucher in
      Lexware Office (e.g. a purchase voucher found via list_vouchers/get_voucher
      whose "files" array is empty — booked without a receipt image). It
      uploads the file and ASSIGNS it to the voucher identified by voucher_id
      (POST /v1/vouchers/{id}/files). This is a WRITE action. It is annotated
      as such, so your client may ask the user; JanuaPort itself never asks.
      It needs the tool-exact permission "lexware-office:attach_file_to_voucher".
      Use this when a booked voucher is MISSING its document image. To merely drop a
      NEW receipt into the inbox (Belegerfassung) for a not-yet-booked expense, use
      upload_voucher_file instead — IF it appears in your tool list (as a write
      action it needs its own tool-exact write scope for this integration,
      separate from this tool's). upload_voucher_file creates a separate inbox
      document and does NOT attach to an existing voucher (the wrong tool here
      would create a duplicate). If upload_voucher_file is unavailable to you,
      use report_problem instead of attaching it here as a workaround, naming
      this integration (exact name as shown by the catalog tool).
      The file is base64 in "content" (max 5 MiB decoded); provide "filename" and
      "content_type" (application/pdf, image/jpeg, image/png). Returns the new file's
      id. Retrying after an error may attach a SECOND copy — check the voucher first.
    write: true
    params:
      - name: voucher_id
        description: >
          Required. The id (UUID) of the existing voucher to attach the file to,
          as returned by list_vouchers / get_voucher.
        type: string
        required: true
      - name: content
        description: Required. File content, base64-encoded. Max 5 MiB after decoding.
        type: string
        required: true
      - name: filename
        description: Required. The file name, e.g. "rechnung-2026-05.pdf".
        type: string
        required: true
      - name: content_type
        description: Required. MIME type, e.g. application/pdf, image/jpeg, image/png.
        type: string
        required: true
    request:
      method: POST
      path: /v1/vouchers/{voucher_id}/files
      encoding: multipart
      body:
        - name: file
          file: content
          filename: "{filename}"
          content_type: "{content_type}"
    response: "{id: id}"

  - name: create_contact
    description: >
      Creates a new CUSTOMER contact in Lexware Office and returns its id; that
      id is the contact_id for create_invoice. Look the customer up with
      list_contacts (by email or name) first: each call creates a new contact,
      and Lexware has no idempotency key. Set exactly one of the two contact
      types: a company (company_name, optionally vat_id) or a person (last_name,
      optionally first_name). Lexware answers HTTP 400 when both or neither are
      set. The billing address (street, zip, city, country_code as ISO 3166
      alpha-2, e.g. DE) is required; email is optional (one address). This is a
      WRITE action. It is annotated as such, so your client may ask the user;
      JanuaPort itself never asks. It needs the tool-exact permission
      "lexware-office:create_contact". Lexware allows about 2 requests per
      second for all calls together; JanuaPort spaces calls 500 ms apart.
    write: true
    params:
      - name: company_name
        description: >
          The company name, for a company contact. Leave empty for a person.
        type: string
      - name: vat_id
        description: >
          Optional. The company's VAT registration id (USt-IdNr.), e.g.
          DE123456789. Only together with company_name.
        type: string
      - name: first_name
        description: Optional. The person's first name, for a person contact.
        type: string
      - name: last_name
        description: >
          The person's last name, for a person contact. Leave empty for a
          company.
        type: string
      - name: street
        description: Required. Street and house number of the billing address.
        type: string
        required: true
      - name: zip
        description: Required. Postal code of the billing address.
        type: string
        required: true
      - name: city
        description: Required. City of the billing address.
        type: string
        required: true
      - name: country_code
        description: >
          Required. Country of the billing address as ISO 3166 alpha-2 code,
          e.g. DE, AT, CH.
        type: string
        required: true
      - name: email
        description: Optional. The business email address of the contact.
        type: string
    request:
      method: POST
      path: /v1/contacts
      encoding: json
      body_json:
        # Lexware: version 0 on create, and "The role must be set as an empty
        # object" — the empty object is a constant and is sent as {}.
        version: 0
        roles:
          customer: {}
        company:
          name: "{company_name}"
          vatRegistrationId: "{vat_id}"
        person:
          firstName: "{first_name}"
          lastName: "{last_name}"
        addresses:
          billing:
            - street: "{street}"
              zip: "{zip}"
              city: "{city}"
              countryCode: "{country_code}"
        emailAddresses:
          business:
            - "{email}"
    # Lexware answers with id, resourceUri, createdDate, updatedDate, version.
    response: "{id: id}"

  - name: create_invoice
    description: >
      Creates a FINALIZED sales invoice in Lexware Office for an existing
      contact and returns the new invoice's id. Finalized means: Lexware
      assigns the invoice number and sets the status to open; content and
      status cannot be changed via the API afterwards (a correction is a credit
      note in Lexware). The tool sends no email and triggers no payment; the
      Lexware API has no mail endpoint. To read the invoice afterwards (number,
      totals, due date) use get_invoice with the returned id. Each call creates
      a new invoice: Lexware has no idempotency key, so repeating a call, also
      after a timeout or an error, creates a second invoice with its own
      number. Before repeating, check with list_vouchers (voucherType=invoice)
      whether the invoice exists. contact_id comes from list_contacts or
      create_contact; Lexware takes the billing address from that contact.
      Up to three line items: item1_* is required, item2_* and item3_* are
      optional. Set all five values of a line item (name, quantity, unit,
      net_price, tax_rate) or none: a line item without any value is left out,
      a line item with only some values is rejected by JanuaPort before sending:
      the error names the missing values and no invoice is created. Prices are
      NET amounts in EUR per unit (e.g.
      92.5), the tax rate is in percent (e.g. 19, 7 or 0); Lexware computes
      gross amounts and totals. The tax type is always net; reverse charge,
      intra-community supply and other tax-free EU cases are outside this tool
      and stay manual in Lexware. Dates (voucher_date, service_from,
      service_to) use the format yyyy-MM-ddTHH:mm:ss.SSSXXX with offset, e.g.
      2026-10-14T00:00:00.000+02:00. The service period is required on a
      German invoice (§ 14 UStG). payment_term_label is required: it is the
      payment terms text printed on the invoice, and Lexware rejects an invoice
      without it. This is a WRITE action. It is annotated as
      such, so your client may ask the user; JanuaPort itself never asks. It
      needs the tool-exact permission "lexware-office:create_invoice". Lexware
      allows about 2 requests per second for all calls together; JanuaPort
      spaces calls 500 ms apart.
    write: true
    params:
      - name: contact_id
        description: >
          Required. The id (UUID) of the customer contact, from list_contacts or
          create_contact.
        type: string
        required: true
      - name: voucher_date
        description: >
          Required. The invoice date, e.g. 2026-10-14T00:00:00.000+02:00.
        type: string
        required: true
      - name: service_from
        description: >
          Required. Start of the service period, e.g.
          2026-10-14T00:00:00.000+02:00.
        type: string
        required: true
      - name: service_to
        description: >
          Required. End of the service period (not before service_from), e.g.
          2027-10-13T00:00:00.000+02:00.
        type: string
        required: true
      - name: payment_term_days
        description: >
          Required. Days until payment is due, counted from voucher_date
          (Lexware derives the due date from it), e.g. 14.
        type: integer
        required: true
      - name: payment_term_label
        description: >
          Required. The payment terms text printed on the invoice, e.g.
          "Zahlbar innerhalb von 14 Tagen ohne Abzug". Lexware rejects an
          invoice without it.
        type: string
        required: true
      - name: item1_name
        description: Required. Name of line item 1 as printed on the invoice.
        type: string
        required: true
      - name: item1_quantity
        description: Required. Quantity of line item 1, e.g. 4 or 2.5.
        type: number
        required: true
      - name: item1_unit
        description: >
          Required. Unit name of line item 1, e.g. Stück, Stunde or Monat
          (Lexware creates an unknown unit name on the fly).
        type: string
        required: true
      - name: item1_net_price
        description: Required. Net unit price of line item 1 in EUR, e.g. 180.
        type: number
        required: true
      - name: item1_tax_rate
        description: Required. Tax rate of line item 1 in percent, e.g. 19.
        type: number
        required: true
      - name: item2_name
        description: Optional line item 2, name. Set all five item2 values or none.
        type: string
      - name: item2_quantity
        description: Optional line item 2, quantity. Set all five item2 values or none.
        type: number
      - name: item2_unit
        description: Optional line item 2, unit name. Set all five item2 values or none.
        type: string
      - name: item2_net_price
        description: Optional line item 2, net unit price in EUR. Set all five item2 values or none.
        type: number
      - name: item2_tax_rate
        description: Optional line item 2, tax rate in percent. Set all five item2 values or none.
        type: number
      - name: item3_name
        description: Optional line item 3, name. Set all five item3 values or none.
        type: string
      - name: item3_quantity
        description: Optional line item 3, quantity. Set all five item3 values or none.
        type: number
      - name: item3_unit
        description: Optional line item 3, unit name. Set all five item3 values or none.
        type: string
      - name: item3_net_price
        description: Optional line item 3, net unit price in EUR. Set all five item3 values or none.
        type: number
      - name: item3_tax_rate
        description: Optional line item 3, tax rate in percent. Set all five item3 values or none.
        type: number
      - name: title
        description: >
          Optional. Invoice title; without it Lexware uses the organization's
          default (e.g. "Rechnung").
        type: string
      - name: introduction
        description: >
          Optional. Introductory text above the line items; without it Lexware
          uses the organization's default.
        type: string
      - name: remark
        description: >
          Optional. Closing remark below the line items, e.g. a payment
          reference; without it Lexware uses the organization's default.
        type: string
    request:
      method: POST
      path: /v1/invoices
      # finalize=true is a CONSTANT: the API creates drafts by default,
      # and "the status of an invoice cannot be changed via the api".
      query:
        - name: finalize
          value: "true"
      encoding: json
      body_json:
        voucherDate: "{voucher_date}"
        # Referencing an existing contact: Lexware requires only contactId.
        address:
          contactId: "{contact_id}"
        # Fixed list of three line items. A line item without any value drops
        # out as a whole, constants included. A partially set one is
        # rejected by JanuaPort before sending, with the missing parameter
        # names (Lexware would refuse it anyway: type custom requires
        # quantity, unitName and unitPrice with currency and taxRatePercentage).
        lineItems:
          - type: custom
            name: "{item1_name}"
            quantity: "{item1_quantity}"
            unitName: "{item1_unit}"
            unitPrice:
              currency: EUR
              netAmount: "{item1_net_price}"
              taxRatePercentage: "{item1_tax_rate}"
          - type: custom
            name: "{item2_name}"
            quantity: "{item2_quantity}"
            unitName: "{item2_unit}"
            unitPrice:
              currency: EUR
              netAmount: "{item2_net_price}"
              taxRatePercentage: "{item2_tax_rate}"
          - type: custom
            name: "{item3_name}"
            quantity: "{item3_quantity}"
            unitName: "{item3_unit}"
            unitPrice:
              currency: EUR
              netAmount: "{item3_net_price}"
              taxRatePercentage: "{item3_tax_rate}"
        totalPrice:
          currency: EUR
        taxConditions:
          taxType: net
        paymentConditions:
          paymentTermLabel: "{payment_term_label}"
          paymentTermDuration: "{payment_term_days}"
        shippingConditions:
          shippingType: serviceperiod
          shippingDate: "{service_from}"
          shippingEndDate: "{service_to}"
        title: "{title}"
        introduction: "{introduction}"
        remark: "{remark}"
    # Lexware answers with id, resourceUri, createdDate, updatedDate, version —
    # no voucherNumber; get_invoice reads it.
    response: "{id: id}"
