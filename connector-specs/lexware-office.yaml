# Lexware Office (lexoffice) Public API — mostly read-only, plus two write tools.
#
# API:        https://api.lexware.io  (Bearer API key, generated by the
#             account owner at https://app.lexware.de → Settings → Public API)
# Docs:       https://developers.lexware.io/docs/
# Credential: stored in the JanuaPort vault under the name "lexware"
#             (jnpt credential set --name lexware). The key is NEVER in this file.
#
# Scope: mostly read-only (GET) — list vouchers in a period, fetch a single
# voucher (purchase docs via get_voucher, sales invoices via get_invoice), look
# up contacts. PLUS two deliberate write tools (Phase 2):
#   * upload_voucher_file attaches a receipt file to the Lexware voucher INBOX
#     (POST /v1/files, type=voucher) — a NEW, not-yet-booked document.
#   * attach_file_to_voucher attaches a receipt file to an EXISTING, already-
#     booked voucher (POST /v1/vouchers/{id}/files) — the "Beleg fehlt" fix.
# Inbox vs. anheften: get_voucher's response carries a "files" array (the ids of
# attached documents); an EMPTY "files" array = no receipt image attached. Use
# attach_file_to_voucher to fix exactly that voucher; use upload_voucher_file
# only to create a fresh inbox document. There is NO file field in the
# voucherlist and NO list filter on receipt presence — find missing receipts by
# paging the list and calling get_voucher per entry (deliberate N+1).
# Both write tools are marked write: true — each needs a tool-exact token scope
# (lexware-office:upload_voucher_file / lexware-office:attach_file_to_voucher);
# a connector-wide scope does NOT grant them (deny-by-default for writes, see
# docs/connector-spec.md).
#
# WICHTIG — typ-spezifische Detail-Endpunkte: /v1/voucherlist ist ein
# typ-ÜBERGREIFENDER Index, aber die Detail-Abfrage ist typ-spezifisch. Es gibt
# KEINEN generischen /v1/vouchers/{id}-Endpunkt für alle Typen:
#   * /v1/vouchers/{id}  bedient NUR Einkaufsbelege (purchaseinvoice,
#     purchasecreditnote)               -> Tool get_voucher
#   * /v1/invoices/{id}  bedient Verkaufsrechnungen (voucherType=invoice)
#                                        -> Tool get_invoice
# Die weiteren Typen haben eigene Endpunkte (creditnote -> /v1/credit-notes/{id},
# deliverynote -> /v1/delivery-notes/{id}, orderconfirmation ->
# /v1/order-confirmations/{id}, quotation -> /v1/quotations/{id},
# downpaymentinvoice -> /v1/down-payment-invoices/{id}, dunning ->
# /v1/dunnings/{id}). Diese sind hier BEWUSST NICHT als Tools ergänzt
# (Read-only-MVP, klein und robust, §3) — dokumentierte Option für später, falls
# ein Use-Case sie braucht. Beleg-Abgleich (purchaseinvoice) und der häufigste
# Verkaufsfall (invoice) sind abgedeckt.
#
# Rate limit: the Lexware API allows ~2 requests/second. min_interval: 500ms
# keeps JanuaPort safely under that without any retry logic.

name: lexware-office
# Fassung dieser Vorlage (Story #427) — siehe demo-erp.yaml für die Bedeutung.
version: "1.0.1"
description: >
  Lexware Office accounting: read vouchers, invoices and contacts, plus attach
  receipt files to the inbox or to an existing voucher.
base_url: https://api.lexware.io

auth:
  header: Authorization
  template: "Bearer {{credential}}"
  credential: lexware

# Lexware allows roughly 2 requests per second; 500 ms between calls stays under
# the limit. A single 429 is reported back to the agent as a clear rate-limit error.
min_interval: 500ms
timeout: 30s

tools:
  - name: list_vouchers
    description: >
      Lists vouchers (invoices, credit notes, quotations, order confirmations,
      delivery notes, down-payment invoices, and purchase documents) from
      Lexware Office, filtered by type and status and optionally by date range.
      This is a TYPE-SPANNING INDEX: each entry has the voucher id, voucherType,
      voucherStatus, voucherNumber, voucherDate, the contact/company name, the
      gross total amount and currency, and whether the voucher is archived.
      Both voucherType and voucherStatus are REQUIRED by the API. Dates use the
      format YYYY-MM-DD (e.g. 2026-05-01). Results are paged: use page (0-based)
      and size (default 25, max 250) to page through large result sets — request
      the next page by increasing page.
      To fetch the FULL DETAILS of one entry, the detail call is type-specific —
      pick the detail tool by voucherType: for purchaseinvoice/purchasecreditnote
      use get_voucher; for invoice use get_invoice. (Other types such as
      creditnote or deliverynote have no detail tool yet; the list entry already
      carries number, date, contact and gross total.)
      Typical receipt-reconciliation use ("is this incoming supplier receipt
      already booked?"): set voucherType=purchaseinvoice, voucherStatus=any and
      the date range, page through the result, then use get_voucher on a matching
      id when you need the line items. For sales-side questions ("which sales
      invoices were recorded last month?") set voucherType=invoice and the status
      you care about, then use get_invoice for details.
      NOTE on missing receipt images: this list carries NO file/attachment field
      and there is NO list filter for whether a receipt image is present. To find
      "purchase vouchers booked WITHOUT a receipt image", page through this list
      with voucherType=purchaseinvoice and, FOR EACH entry, call get_voucher and
      inspect its "files" array — an empty "files" array means no receipt is
      attached. This is deliberately N+1 (one detail call per entry), so keep the
      date range narrow (the API allows only ~2 requests/second).
    # Diese Probe trifft den echten Endpunkt; sie hat einen Pflichtparameter,
    # daher wählt `jnpt connector check` sie nur, wenn sie als check markiert
    # ist — hier bewusst NICHT markiert, weil voucherType/Status Pflicht sind.
    params:
      - name: voucherType
        description: >
          Required. The voucher category to list. One of: invoice, creditnote,
          orderconfirmation, quotation, deliverynote, downpaymentinvoice,
          purchaseinvoice, purchasecreditnote. Combine several with a comma
          (e.g. "invoice,creditnote").
        type: string
        required: true
      - name: voucherStatus
        description: >
          Required. A SINGLE status to filter by. One of: draft, open, paid,
          paidoff, voided, transferred, sepadebit, overdue, accepted, rejected.
          Pass exactly one status per call — the API rejects comma-combined
          statuses (e.g. "open,overdue") with HTTP 400. If you need several
          statuses (e.g. open AND overdue), make one call per status and merge
          the results yourself. The value "any" may be passed to ignore status
          (if supported by the API).
        type: string
        required: true
      - name: voucherDateFrom
        description: >
          Optional. Only vouchers dated on or after this date (inclusive),
          format YYYY-MM-DD.
        type: string
      - name: voucherDateTo
        description: >
          Optional. Only vouchers dated on or before this date (inclusive),
          format YYYY-MM-DD.
        type: string
      - name: archived
        description: >
          Optional. true returns only archived vouchers, false only non-archived.
          Omit to include both.
        type: boolean
      - name: page
        description: >
          Optional. Zero-based page number. Defaults to 0 (the first page).
          Increase to fetch further pages.
        type: integer
      - name: size
        description: >
          Optional. Number of vouchers per page. Default 25, maximum 250.
        type: integer
    request:
      method: GET
      path: /v1/voucherlist
      query:
        - name: voucherType
          value: "{voucherType}"
        - name: voucherStatus
          value: "{voucherStatus}"
        - name: voucherDateFrom
          value: "{voucherDateFrom}"
        - name: voucherDateTo
          value: "{voucherDateTo}"
        - name: archived
          value: "{archived}"
        - name: page
          value: "{page}"
        - name: size
          value: "{size}"
    # Die Voucherlist-Antwort umschließt die Treffer in "content" plus
    # Paging-Metadaten. Wir reichen content (das Array) plus die wichtigsten
    # Paging-Felder durch, damit der Agent weiß, ob es weitere Seiten gibt.
    response: "{vouchers: content, page: number, totalPages: totalPages, last: last}"

  - name: get_voucher
    description: >
      Retrieves a single PURCHASE document (an incoming supplier receipt) from
      Lexware Office by its id. This endpoint serves ONLY purchase vouchers —
      voucherType purchaseinvoice or purchasecreditnote (as listed by
      list_vouchers). For a sales invoice (voucherType=invoice) use get_invoice
      instead; calling this tool with a sales-invoice id fails with HTTP 400.
      Returns the full voucher with all details: type, status, voucher and
      document numbers, voucher date and due date, the associated contact, all
      line items (description, quantity, unit price, tax rate), the net/tax/gross
      totals and currency, and remarks. Use this after list_vouchers (with
      voucherType=purchaseinvoice or purchasecreditnote) when you need the
      complete content of one specific purchase document.
      The response also contains a "files" array: the ids of the documents
      (receipt images) attached to this voucher. An EMPTY "files" array means NO
      receipt image/document is attached — the typical "Beleg fehlt" case for a
      booked purchase voucher. To attach the missing receipt image to exactly
      this voucher, use attach_file_to_voucher — IF it appears in your tool
      list. Being a write action, it always needs its own tool-exact write
      scope for this integration; a connector-wide or read-only scope never
      grants it. Do NOT use upload_voucher_file as a substitute — that only
      drops an unrelated new document into the inbox. If
      attach_file_to_voucher is missing from your tool list, use
      report_problem, naming this integration (exact name as shown by the
      catalog tool), so a human can grant the scope or attach the file for
      you.
    params:
      - name: id
        description: >
          Required. The id (UUID) of a purchase voucher
          (purchaseinvoice/purchasecreditnote) as returned by list_vouchers.
        type: string
        required: true
    request:
      method: GET
      path: /v1/vouchers/{id}
    # Einzelner Einkaufsbeleg: unverändert durchreichen (kein Mapping nötig).
    # /v1/vouchers/{id} bedient laut Lexware-Doku ausschließlich Einkaufsbelege
    # (purchaseinvoice/purchasecreditnote); Verkaufsrechnungen -> get_invoice.

  - name: get_invoice
    description: >
      Retrieves a single SALES INVOICE (an outgoing invoice you issued) from
      Lexware Office by its id. Use this for voucherType=invoice — the id comes
      from list_vouchers run with voucherType=invoice. This is the sales-side
      counterpart to get_voucher (which serves incoming purchase documents);
      do NOT use get_voucher for a sales invoice (it returns HTTP 400).
      Returns the full invoice with all details: status, invoice and document
      numbers, voucher date and due date, the customer contact, all line items
      (description, quantity, unit price, tax rate), the net/tax/gross totals and
      currency, payment terms and remarks. Use this after list_vouchers when you
      need the complete content of one specific sales invoice.
    params:
      - name: id
        description: >
          Required. The sales invoice's id (UUID) as returned by list_vouchers
          when run with voucherType=invoice.
        type: string
        required: true
    request:
      method: GET
      path: /v1/invoices/{id}
    # Einzelne Verkaufsrechnung: unverändert durchreichen (kein Mapping nötig).

  - name: list_contacts
    description: >
      Lists and searches contacts (customers and vendors) in Lexware Office.
      Returns a paged list — each contact has its id, the company name or the
      person's first/last name, roles (customer and/or vendor), customer/vendor
      number, and primary email address. Filter by email or name (case-insensitive
      pattern match, minimum 3 characters), or restrict to customers or vendors
      only. Use this to resolve a name or email from a receipt to a Lexware
      contact, or to look up a contact's number. Results are paged via page
      (0-based) and size (default 25, max 250).
    params:
      - name: email
        description: >
          Optional. Case-insensitive pattern match on the email address (at least
          3 characters). Wildcards _ and % are supported.
        type: string
      - name: name
        description: >
          Optional. Case-insensitive pattern match on the contact/company name
          (at least 3 characters). Wildcards _ and % are supported.
        type: string
      - name: customer
        description: >
          Optional. true returns only contacts that are customers.
        type: boolean
      - name: vendor
        description: >
          Optional. true returns only contacts that are vendors.
        type: boolean
      - name: page
        description: >
          Optional. Zero-based page number. Defaults to 0 (the first page).
        type: integer
      - name: size
        description: >
          Optional. Number of contacts per page. Default 25, maximum 250.
        type: integer
    request:
      method: GET
      path: /v1/contacts
      query:
        - name: email
          value: "{email}"
        - name: name
          value: "{name}"
        - name: customer
          value: "{customer}"
        - name: vendor
          value: "{vendor}"
        - name: page
          value: "{page}"
        - name: size
          value: "{size}"
    response: "{contacts: content, page: number, totalPages: totalPages, last: last}"

  - name: upload_voucher_file
    description: >
      Uploads a receipt/document FILE into the Lexware Office voucher inbox
      ("Belegerfassung"), so Lexware can attach it to a booking. This is a
      WRITE/MUTATING action: it creates a new file in the account's inbox.
      IMPORTANT — a human must confirm this upload before it is performed; do
      not call it autonomously. The file is sent as base64 in the "content"
      parameter (max 5 MiB after decoding); provide a sensible "filename" and
      the file's "content_type" (e.g. application/pdf, image/jpeg, image/png).
      The document lands in the inbox only — it is NOT booked or matched to a
      payment automatically; Lexware's own matching takes over from there
      (assigning a receipt to a bank transaction is not available via the API).
      On success returns the new file's id. Typical use: after finding the right
      receipt, upload it here, then tell the user it is in the Lexware inbox for
      review. Retrying after an error may upload a SECOND copy — check the inbox
      first.
      Distinction: to add a receipt image to an ALREADY EXISTING/booked voucher
      (whose "files" array is empty), use attach_file_to_voucher instead — IF
      it appears in your tool list (as a write action it needs its own
      tool-exact write scope for this integration, separate from this tool's).
      upload_voucher_file only creates a NEW inbox document and does NOT attach
      to an existing voucher; if attach_file_to_voucher is unavailable to you,
      do not upload here as a workaround — that creates an unrelated
      duplicate. Use report_problem instead, naming this integration (exact
      name as shown by the catalog tool).
    write: true
    params:
      - name: content
        description: >
          Required. The file content, base64-encoded. Maximum 5 MiB after
          decoding. The raw bytes are never logged or returned.
        type: string
        required: true
      - name: filename
        description: >
          Required. The file name shown in the Lexware inbox, e.g.
          "rechnung-2026-05.pdf".
        type: string
        required: true
      - name: content_type
        description: >
          Required. The MIME type of the file, e.g. application/pdf, image/jpeg
          or image/png. Must match the actual file content.
        type: string
        required: true
    request:
      method: POST
      path: /v1/files
      encoding: multipart
      body:
        # type=voucher routes the upload into the voucher inbox (Belegerfassung).
        - name: type
          value: voucher
        # The binary file part. filename + content_type come from the agent's
        # arguments; the content is base64-decoded by JanuaPort before sending.
        - name: file
          file: content
          filename: "{filename}"
          content_type: "{content_type}"
    # Lexware returns the created file with its id; project to just the id.
    response: "{id: id}"

  - name: attach_file_to_voucher
    description: >
      Attaches a receipt/document FILE to an EXISTING, already-booked voucher in
      Lexware Office (e.g. a purchase voucher found via list_vouchers/get_voucher
      whose "files" array is empty — booked without a receipt image). WRITE/MUTATING:
      uploads the file and ASSIGNS it to the voucher identified by voucher_id
      (POST /v1/vouchers/{id}/files). A human must confirm before it is performed;
      do not call autonomously.
      Use this when a booked voucher is MISSING its document image. To merely drop a
      NEW receipt into the inbox (Belegerfassung) for a not-yet-booked expense, use
      upload_voucher_file instead — IF it appears in your tool list (as a write
      action it needs its own tool-exact write scope for this integration,
      separate from this tool's). upload_voucher_file creates a separate inbox
      document and does NOT attach to an existing voucher (the wrong tool here
      would create a duplicate). If upload_voucher_file is unavailable to you,
      use report_problem instead of attaching it here as a workaround, naming
      this integration (exact name as shown by the catalog tool).
      The file is base64 in "content" (max 5 MiB decoded); provide "filename" and
      "content_type" (application/pdf, image/jpeg, image/png). Returns the new file's
      id. Retrying after an error may attach a SECOND copy — check the voucher first.
    write: true
    params:
      - name: voucher_id
        description: >
          Required. The id (UUID) of the existing voucher to attach the file to,
          as returned by list_vouchers / get_voucher.
        type: string
        required: true
      - name: content
        description: Required. File content, base64-encoded. Max 5 MiB after decoding.
        type: string
        required: true
      - name: filename
        description: Required. The file name, e.g. "rechnung-2026-05.pdf".
        type: string
        required: true
      - name: content_type
        description: Required. MIME type, e.g. application/pdf, image/jpeg, image/png.
        type: string
        required: true
    request:
      method: POST
      path: /v1/vouchers/{voucher_id}/files
      encoding: multipart
      body:
        - name: file
          file: content
          filename: "{filename}"
          content_type: "{content_type}"
    response: "{id: id}"
